<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row mt-3">
            <div class="col-md-3">

            </div>
            <div class="col-md-6">
                <form class="form-group">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="username" placeholder="Enter Username" class="form-control" >               
                        </div>
                        <div class="col-md-6">
                            <input type="email"  id="email" placeholder="Enter Email" class="form-control ">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <input type="password"  id="password" placeholder="Enter Password" onblur="check()" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <input type="passeord"  id="confirmpassword" placeholder="Enter Confirm Password" onblur="check()" class="form-control">
                            <p id="message" class="text-danger"></p>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3" onclick="check()">Submit</button>
                </form>
            </div>
            <div class="col-md-3">

             </div>

        </div>
    </div>

    <script>
        function check(){
            let pass=document.getElementById("password").value;
            let confirmpass=document.getElementById("confirmpassword").value;
            if(pass=="" || confirmpass==""){
                document.getElementById("message").innerHTML="Password and Confirm Password are required";
            }
            else if(pass!=confirmpass){
             document.getElementById("message").innerHTML="Password and Confirm Password are not same";
            }
            else{
                document.getElementById("message").innerHTML="";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
