<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="row">
        <div class="col-md-1">
            <div class="card">
                <div class="card-body" >
                    <img src="./images/deer.jpeg" alt="deer"  onmouseover="display(this)" onmouseout="show()" width="100%" height="100%">
                            
                </div>
                <div class="card-body">
                    <img src="./images/fox.jpeg" alt="fox" onmouseover="display(this)" onmouseout="show()"width="100%" height="100%">
                        
                </div>
                <div class="card-body">
                    <img src="./images/jaguar.jpeg" alt="jaguar" onmouseover="display(this)" onmouseout="show()" width="100%" height="40%">
                        
                </div>
                <div class="card-body">
                    <img src="./images/tiger.jpg" alt="tiger" onmouseover="display(this)"  onmouseout="show()"width="100%" height="100%">

                </div>
            </div>
        </div>
        <div class="col-md-11">       
            <div class="card text-bg-dark mb-3" style="width: 50%; height: 80%;">
                    <img src="./images/tiger.jpg" alt="tiger" id="showimg" width="100%" height="100%">

                </div>
        </div>
    </div>

    <script>
        let oldimg=document.getElementById("showimg").src;
        let newimg="";
        function display(img){
            newimg=img.src;
            document.getElementById("showimg").src=img.src;
        }
       function show(){
            document.getElementById("showimg").src=oldimg;
            oldimg=newimg;

        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
